# The `qrosetta` package: the command-line tool in qrosetta_cli/ only. The API, the frontend,
# the runners and the compilers ship as container images. Built and published by
# .github/workflows/release-images.yml; CONTRIBUTING.md (Packaging) describes a local build.

[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "qrosetta"
dynamic = ["version"]
description = "Command-line tool for Quantum Rosetta: starts the local container stack and runs circuits against a Quantum Rosetta server"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Shaswato Sarker" },
    { name = "Majid Haghparast" },
    { name = "Tommi Mikkonen" },
]
keywords = ["quantum computing", "quantum simulation", "benchmarking", "reproducibility", "OpenQASM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.scripts]
qrosetta = "qrosetta_cli.cli:main"

[project.urls]
Homepage = "https://github.com/SeQuSoS-Project/QRosetta"
Documentation = "https://github.com/SeQuSoS-Project/QRosetta#readme"
Source = "https://github.com/SeQuSoS-Project/QRosetta"
Issues = "https://github.com/SeQuSoS-Project/QRosetta/issues"
Changelog = "https://github.com/SeQuSoS-Project/QRosetta/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["qrosetta_cli", "qrosetta_cli.client", "qrosetta_cli.stack"]
include-package-data = false

[tool.setuptools.package-data]
qrosetta_cli = ["schemas/*.json", "release/manifest.json"]

[tool.setuptools.dynamic]
version = { attr = "qrosetta_cli.__version__" }

# Lint and format settings (ruff); they do not change the wheel. CONTRIBUTING.md (Lint gates)
# describes the CI jobs and the per-file baseline at the end of this file.
[tool.ruff]
# The API image and most runner images run Python 3.10; the CLI needs 3.11 (requires-python above).
target-version = "py310"
per-file-target-version = { "qrosetta_cli/**" = "py311" }
line-length = 120
# Frozen scripts of a published experiment run.
extend-exclude = ["experiments"]

[tool.ruff.format]
# Only qrosetta_cli/ is formatted with ruff; the rest of the tree keeps its own layout for now.
exclude = ["rosetta-api/**", "runners/**", "compilers/**", "shared/**", "scripts/**", "tests/**"]

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "S"]
ignore = [
    # Annotation spelling (List -> list, Optional[X] -> X | None): a tree-wide rewrite, not a bug.
    "UP006", "UP007", "UP035", "UP045",
    # Fires on every subprocess call with an argument list; shell=True is S602/S604, still selected.
    "S603",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Path",
    "fastapi.Query", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the idiom, credentials and temp paths are fixtures, and zip() pairs equal-length
# expectations. The security rules apply to shipped code.
"rosetta-api/tests/**" = ["S", "B905"]
"tests/**" = ["S", "B905"]

# Reviewed, not defects.
"qrosetta_cli/client/refs.py" = ["S105"]  # "token" names a command-line token, not a secret
"qrosetta_cli/localstack.py" = ["S105"]  # TOKEN_FILE is a file name
"rosetta-api/services/security.py" = ["S105", "B904"]  # PROXY_TOKEN_HEADER is a header name
"qrosetta_cli/client/servers.py" = ["S104"]  # maps a 0.0.0.0 bind to the URL "localhost"
"qrosetta_cli/stack/serve.py" = ["S104"]  # same mapping for a published port
"qrosetta_cli/stack/doctor.py" = ["S108"]  # reports free space in /var/tmp; writes nothing there
"qrosetta_cli/stack/explain.py" = ["S108"]  # names /var/tmp in an explanation
"qrosetta_cli/client/transport.py" = ["S310"]  # the server URL is checked to be http or https
"qrosetta_cli/stack/commands.py" = ["S607"]  # bash from PATH, as the engine is
"scripts/release/make_manifest.py" = ["S607"]  # git from PATH
"rosetta-api/services/circuit_library.py" = ["S102"]  # exec() of the repository's algorithm_templates/
"rosetta-api/services/job_store.py" = ["S301"]  # unpickles only the API's own spill files
"rosetta-api/services/prep_worker.py" = ["S301", "B904"]  # unpickles only its own child's pipe
"rosetta-api/services/job_manager.py" = ["S311", "B904", "B905"]  # random draws a simulation seed
"rosetta-api/services/dispatcher_k8s.py" = ["S110", "S112", "B904"]  # retried or best-effort calls
