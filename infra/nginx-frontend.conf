server_tokens off;

# Installed as a template: the image's entrypoint substitutes ${QROSETTA_*} variables only.

# Security headers for what nginx serves itself (files on disk, its own error responses).
# A proxied response keeps the API's own (routers/security_headers.py), so each map is
# empty when the API sent that header; an empty value adds no header.
map $uri $qr_own_csp {
    /share.html "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default     "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-src https://quirk-e.dev; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
}
map $upstream_http_content_security_policy $qr_csp {
    ""      $qr_own_csp;
    default "";
}
map $upstream_http_x_content_type_options $qr_nosniff {
    ""      "nosniff";
    default "";
}
map $upstream_http_referrer_policy $qr_referrer_policy {
    ""      "no-referrer";
    default "";
}
map $upstream_http_cross_origin_opener_policy $qr_coop {
    ""      "same-origin";
    default "";
}
map $upstream_http_x_frame_options $qr_frame_options {
    ""      "DENY";
    default "";
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 5M;

    # Cloud Run's front end appends the client address to X-Forwarded-For, possibly followed
    # by a Google load balancer address; $remote_addr becomes the rightmost entry outside
    # these Google-internal ranges, which a client cannot forge.
    set_real_ip_from 169.254.0.0/16;
    set_real_ip_from 35.191.0.0/16;
    set_real_ip_from 130.211.0.0/22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    add_header_inherit merge;
    add_header Content-Security-Policy $qr_csp always;
    add_header X-Content-Type-Options $qr_nosniff always;
    add_header Referrer-Policy $qr_referrer_policy always;
    add_header Cross-Origin-Opener-Policy $qr_coop always;
    add_header X-Frame-Options $qr_frame_options always;

    # A body over client_max_body_size gets the API's JSON error shape.
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"detail": "Request body exceeds the proxy limit of 5 MB"}';
    }

    # Static files and uncompressed API responses are compressed here; a response the
    # API already compressed passes through unchanged.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # The read-only share page is never cached (its policy is the share map entry above).
    location = /share.html {
        add_header Cache-Control "no-store" always;
        try_files /share.html =404;
    }

    location ~ ^/(js|css)/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vendored libraries live under a versioned path, so a cached copy never goes stale.
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Existing files are served from disk; everything else is proxied to the Rahti API,
    # so the browser sees a single origin.
    location / {
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass https://rosetta-api-route-qrosetta.2.rahtiapp.fi;
        proxy_http_version 1.1;
        proxy_set_header Host rosetta-api-route-qrosetta.2.rahtiapp.fi;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API keys rate limits on X-Qrosetta-Client-Ip only when the token matches its own.
        proxy_set_header X-Qrosetta-Client-Ip $remote_addr;
        proxy_set_header X-Qrosetta-Proxy-Token "${QROSETTA_PROXY_TOKEN}";
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}
