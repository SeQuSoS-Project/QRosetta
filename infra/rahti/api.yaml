apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: rosetta-api
    labels:
      app: rosetta-api
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: rosetta-api
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app: rosetta-api
      spec:
        containers:
        - name: api
          image: image-registry.apps.2.rahti.csc.fi/qrosetta/rosetta-api:latest
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8000
          env:
          - name: OMP_NUM_THREADS
            value: "1"
          - name: MKL_NUM_THREADS
            value: "1"
          - name: OPENBLAS_NUM_THREADS
            value: "1"
          - name: NUMEXPR_NUM_THREADS
            value: "1"
          - name: EXECUTION_MODE
            value: "kubernetes"
          - name: K8S_IMAGE_REGISTRY
            value: "image-registry.apps.2.rahti.csc.fi/qrosetta"
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: RUNNER_TIMEOUT_SEC
            value: "300"
          # Services whose images are not in this project's registry.
          - name: QROSETTA_NOT_DEPLOYED
            value: "bqskit,cirq-transformers,qsynth"
          - name: QROSETTA_K8S_MAX_CONCURRENT_JOBS
            value: "3"
          - name: CORS_ALLOW_ORIGINS
            value: "https://rosetta-frontend-652754634999.us-central1.run.app,http://localhost:3000,http://localhost:8080"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: rosetta-secrets
                key: DATABASE_URL
          # JWT signing key. The API refuses to start without it when
          # EXECUTION_MODE is not "local". Create it once with:
          #   oc create secret generic rosetta-secrets -n qrosetta \
          #     --from-literal=SECRET_KEY="$(openssl rand -base64 48)" ...
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: rosetta-secrets
                key: SECRET_KEY
          # Shared with the Cloud Run frontend (deploy_frontend.sh): a request carrying it
          # is rate-limited by the client address that proxy saw. Add it with:
          #   oc patch secret rosetta-secrets -n qrosetta \
          #     -p "{\"stringData\":{\"QROSETTA_PROXY_TOKEN\":\"$(openssl rand -hex 32)\"}}"
          - name: QROSETTA_PROXY_TOKEN
            valueFrom:
              secretKeyRef:
                name: rosetta-secrets
                key: QROSETTA_PROXY_TOKEN
                optional: true
          - name: STORAGE_MODE
            value: "s3"
          - name: S3_ENDPOINT_URL
            value: "https://a3s.fi"
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: rosetta-secrets
                key: S3_ACCESS_KEY
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: rosetta-secrets
                key: S3_SECRET_KEY
          - name: S3_BUCKET_NAME
            valueFrom:
              secretKeyRef:
                name: rosetta-secrets
                key: S3_BUCKET_NAME
          - name: S3_REGION
            value: "us-east-1"
          resources:
            limits:
              cpu: "0.5"
              memory: "2Gi"
            requests:
              cpu: "100m"
              memory: "256Mi"

- apiVersion: v1
  kind: Service
  metadata:
    name: rosetta-api
  spec:
    type: ClusterIP
    selector:
      app: rosetta-api
    ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: rosetta-api-route
    annotations:
      # 300 s maximum job time plus a 30 s buffer, as in nginx and gunicorn.
      haproxy.router.openshift.io/timeout: 330s
      # The router appends the connecting address to X-Forwarded-For; the API keys rate
      # limits on that last entry.
      haproxy.router.openshift.io/set-forwarded-headers: append
  spec:
    to:
      kind: Service
      name: rosetta-api
    port:
      targetPort: 8000
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
