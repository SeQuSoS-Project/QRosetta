# The project name and the org.qrosetta.project label come from QROSETTA_PROJECT (default
# qsimulators); qrosetta stops and removes only what carries both. Volumes keep compose's own
# labels: compose offers to recreate, and empty, a volume whose labels change.
# org.qrosetta.id is the service's registry key in config.py, org.qrosetta.kind is core, runner
# or compiler, and org.qrosetta.profiles lists the qrosetta profiles it belongs to
# (test_runner_registry_sync.py checks all three).
name: ${QROSETTA_PROJECT:-qsimulators}

x-qrosetta-labels: &qrosetta-labels
  org.qrosetta.project: ${QROSETTA_PROJECT:-qsimulators}

# Every service: no Linux capabilities and no privilege gain through setuid files. Each service
# also caps its processes at 1024 (deploy.resources.limits.pids); a runner's isolated child and
# its threads stay far below it.
x-qrosetta-hardening: &qrosetta-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # --- Service 1: Nginx ( The Bridge ) ---
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
      labels:
        org.qrosetta.image.project: ${QROSETTA_PROJECT:-qsimulators}
        org.qrosetta.service: nginx
    labels:
      <<: *qrosetta-labels
      org.qrosetta.id: nginx
      org.qrosetta.kind: core
    container_name: nginx-reverse-proxy
    <<: *qrosetta-hardening
    ports:
      - "${QROSETTA_HTTP_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public_net
      - isolated_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "128M"
          pids: 1024

  # --- Service 2: The API ( The Brain ) ---
  api:
    build:
      context: .
      dockerfile: ./rosetta-api/Dockerfile
      args:
        - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
      labels:
        org.qrosetta.image.project: ${QROSETTA_PROJECT:-qsimulators}
        org.qrosetta.service: api
    labels:
      <<: *qrosetta-labels
      org.qrosetta.id: api
      org.qrosetta.kind: core
    container_name: rosetta-api
    <<: *qrosetta-hardening
    environment:
      - RUNNER_TIMEOUT_SEC=${RUNNER_TIMEOUT_SEC:-300}
      - RUNNER_QUEUE_MAX_WAIT_SEC=${RUNNER_QUEUE_MAX_WAIT_SEC:-1800}
      - QROSETTA_GPU_AVAILABLE=${QROSETTA_GPU_AVAILABLE:-false}
      - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
      - QROSETTA_IMAGE_DIGESTS=${QROSETTA_IMAGE_DIGESTS:-}
      - MAX_QUBITS_STATEVECTOR=${MAX_QUBITS_STATEVECTOR:-18}
      - MAX_QUBITS_MEASURED=${MAX_QUBITS_MEASURED:-24}
      - MAX_QUBITS_COMPILE=${MAX_QUBITS_COMPILE:-24}
      - QROSETTA_JOB_TTL_SEC=${QROSETTA_JOB_TTL_SEC:-86400}
      - QROSETTA_LIFECYCLE_TOKEN_FILE=/run/secrets/lifecycle_token
    volumes:
      - rosetta_db_data:/home/appuser/app/data
      # The lifecycle token `qrosetta start` writes ($XDG_RUNTIME_DIR/qrosetta/lifecycle.token);
      # without it the empty placeholder is mounted and the API accepts no lifecycle token. `Z`
      # relabels it for this container under SELinux; hosts without SELinux ignore it.
      - type: bind
        source: ${QROSETTA_LIFECYCLE_TOKEN_PATH:-./infra/lifecycle-token.none}
        target: /run/secrets/lifecycle_token
        read_only: true
        bind:
          selinux: Z
    networks:
      - isolated_net
    healthcheck:
      test: [ "CMD", "python3", "-c", "__import__('urllib.request').request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "2G"
          pids: 1024

  # --- Services 3-10: The Runners ( The Hands ) ---

  pytket_qiskit_runner:
    build:
      context: .
      dockerfile: ./runners/pytket-qiskit-runner/Dockerfile
      args:
        - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
        - QROSETTA_IMAGE_SOURCE=${QROSETTA_IMAGE_SOURCE:-built_locally}
        - QROSETTA_RELEASE=${QROSETTA_RELEASE:-}
      labels:
        org.qrosetta.image.project: ${QROSETTA_PROJECT:-qsimulators}
        org.qrosetta.service: pytket_qiskit_runner
    labels:
      <<: *qrosetta-labels
      org.qrosetta.id: qiskit
      org.qrosetta.kind: runner
      org.qrosetta.profiles: "minimal,cpu,gpu,full"
    container_name: pytket-qiskit-runner
    <<: *qrosetta-hardening
    environment:
      - QROSETTA_HOST_OS=${QROSETTA_HOST_OS:-}
      - QROSETTA_HOST_ARCH=${QROSETTA_HOST_ARCH:-}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - NUMBA_NUM_THREADS=1
      - RUNNER_MAX_CONCURRENT=${RUNNER_MAX_CONCURRENT:-1}
      - MAX_QUBITS_STATEVECTOR=${MAX_QUBITS_STATEVECTOR:-18}
      - MAX_QUBITS_MEASURED=${MAX_QUBITS_MEASURED:-24}
    networks:
      - isolated_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
          pids: 1024

  pytket_cirq_runner:
    build:
      context: .
      dockerfile: ./runners/pytket-cirq-runner/Dockerfile
      args:
        - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
