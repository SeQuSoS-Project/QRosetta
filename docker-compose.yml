services:
  # --- Service 1: Nginx ( The Bridge ) ---
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public_net
      - isolated_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "128M"

  # --- Service 2: The API ( The Brain ) ---
  api:
    build:
      context: .
      dockerfile: ./rosetta-api/Dockerfile
      args:
        - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
    container_name: rosetta-api
    environment:
      - RUNNER_TIMEOUT_SEC=${RUNNER_TIMEOUT_SEC:-300}
      - RUNNER_QUEUE_MAX_WAIT_SEC=${RUNNER_QUEUE_MAX_WAIT_SEC:-1800}
      - QROSETTA_GPU_AVAILABLE=${QROSETTA_GPU_AVAILABLE:-false}
      - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
      - QROSETTA_IMAGE_DIGESTS=${QROSETTA_IMAGE_DIGESTS:-}
    volumes:
      - rosetta_db_data:/home/appuser/app/data
    networks:
      - isolated_net
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/algorithms')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "2G"

  # --- Services 3-10: The Runners ( The Hands ) ---

  pytket_qiskit_runner:
    build:
      context: .
      dockerfile: ./runners/pytket-qiskit-runner/Dockerfile
      args:
        - QROSETTA_GIT_SHA=${QROSETTA_GIT_SHA:-unknown}
    container_name: pytket-qiskit-runner
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - NUMBA_NUM_THREADS=1
      - RUNNER_MAX_CONCURRENT=${RUNNER_MAX_CONCURRENT:-1}
    networks:
      - isolated_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  pytket_cirq_runner:
