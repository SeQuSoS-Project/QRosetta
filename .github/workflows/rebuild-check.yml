# Monthly rebuild check: every image a release builds (scripts/release/make_manifest.py
# --list-images, which leaves out myQLM, cuQuantum and BQSKit) is built from scratch, without the
# layer cache (NO_CACHE=1), then self-tested and scanned with Trivy exactly as in
# release-images.yml. It finds a pinned package or base image that can no longer be fetched, a
# self-test that no longer passes, and vulnerabilities published since the last release. Nothing
# is pushed. The SARIF reports go to code scanning in the public repository.
# Every third-party action is pinned to a commit; the comment gives its release.
name: rebuild check

on:
  schedule:
    - cron: "17 3 4 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-check
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the manifest script's dependencies
        run: python -m pip install PyYAML==6.0.3 pydantic==2.9.2 pydantic-settings==2.14.2

      - name: Version
        id: version
        run: |
          version=$(python -c 'import re, pathlib; print(re.search(r"^__version__ = \"([^\"]+)\"$", pathlib.Path("qrosetta_cli/__init__.py").read_text(), re.M).group(1))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Images a release builds
        id: images
        run: echo "images=$(python scripts/release/make_manifest.py --list-images)" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      ID: ${{ matrix.id }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      LABELS: ${{ matrix.labels }}
      SELF_TEST: ${{ matrix.self_test }}
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: qrosetta-${{ matrix.infra_host }}:rebuild-check
      NO_CACHE: "1"
      IMAGE_SOURCE: built_locally
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: scripts/release/image.sh build

      - name: Self-test
        run: scripts/release/image.sh self-test

      - name: Scan
        run: scripts/release/image.sh scan

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('trivy/trivy.sarif') != '' }}
        with:
          name: trivy-${{ matrix.id }}
          path: trivy/trivy.sarif
          if-no-files-found: error

  scan-results:
    name: code scanning ${{ matrix.id }}
    needs: [plan, images]
    if: ${{ !cancelled() && github.repository == 'SeQuSoS-Project/QRosetta' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: trivy-${{ matrix.id }}
          path: trivy

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: steps.download.outcome == 'success'
        with:
          sarif_file: trivy/trivy.sarif
          category: trivy-${{ matrix.id }}
