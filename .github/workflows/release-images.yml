# Release pipeline (packaging plan §8.2; CONTRIBUTING.md, Packaging).
#
# A tag v<version> builds every distributable image (all but myQLM, cuQuantum and BQSKit, listed by
# scripts/release/make_manifest.py --list-images), runs its self-test and scans it with Trivy
# (scripts/release/image.sh scan): a CRITICAL vulnerability with a fixed version, not accepted in
# .trivyignore, fails the image and so the release; the SARIF report goes to code scanning in
# the public repository (job scan-results). When the repository variable
# QROSETTA_PUBLISH_IMAGES is 'true' it also pushes them to GHCR, signs them with cosign, attests
# their provenance and attaches an SPDX SBOM (syft) as an attestation, writes each image's
# source notice (artifact notice-<id>, scripts/release/image_notice.py) for the release page, and
# writes the release manifest with their digests and image ids into the wheel. Every wheel also
# carries the build kit of the tagged commit (scripts/release/make_buildkit.py), from which an
# installed qrosetta builds any image, the three above included. With the variable
# unset no image is pushed. No image is pushed either unless the openapi job has written the API
# description from the tagged code (scripts/release/release_assets.py openapi).
#
# The wheel of a final version tag (X.Y.Z, X.Y.Z.postN) goes to PyPI, and only once the images
# are published. The wheel of a pre-release tag (PEP 440 aN, bN, rcN or .devN) goes to TestPyPI
# and never to PyPI.
#
# In the public repository, once the wheel is uploaded, release-assets collects the files of the
# release page (wheel, sdist, an SPDX SBOM and a source notice per image, openapi-<version>.json,
# the image list with its verify commands, SHA256SUMS) and attests their provenance
# (qrosetta-<version>.intoto.jsonl). For a final version, publish-release then creates the GitHub
# release as a draft, attaches those files, checks the attached copies against SHA256SUMS and
# only then publishes it (immutable releases accept no asset after publication). A pre-release tag
# gets no GitHub release, so Zenodo, which archives published GitHub releases, never sees it.
# A final tag stops in plan when CHANGELOG.md has no dated section for its version.
#
# workflow_dispatch is a dry run: the same image builds and self-tests, then a wheel versioned
# <release>.dev<run number>, with a manifest that names no image digest, goes to TestPyPI.
#
# PyPI and TestPyPI trust this file by name (Trusted Publishing, environments pypi and testpypi).
# Every third-party action is pinned to a commit; the comment gives its release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.version.outputs.registry }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the manifest script's dependencies
        run: python -m pip install PyYAML==6.0.3 pydantic==2.9.2 pydantic-settings==2.14.2

      - name: Version
        id: version
        run: |
          base=$(python -c 'import re, pathlib; print(re.search(r"^__version__ = \"([^\"]+)\"$", pathlib.Path("qrosetta_cli/__init__.py").read_text(), re.M).group(1))')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match qrosetta_cli.__version__ $base"
              exit 1
            fi
            version="$base"
          else
            version="$(printf '%s' "$base" | sed -E 's/^([0-9]+(\.[0-9]+)*).*/\1/').dev${GITHUB_RUN_NUMBER}"
          fi
          prerelease=$(python scripts/release/check_dist.py --prerelease "$version")
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Images a release builds
        id: images
        run: echo "images=$(python scripts/release/make_manifest.py --list-images)" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: github.event_name == 'push' && steps.version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release/release_assets.py notes --version "$VERSION" --check

  openapi:
    name: openapi.json
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the API's locked dependencies
        run: python -m pip install --require-hashes -r rosetta-api/requirements.lock

      - name: Write the API description
        run: |
          mkdir -p openapi
          python scripts/release/release_assets.py openapi --out "openapi/openapi-$VERSION.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: openapi/
          if-no-files-found: error

  images:
    name: image ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      ID: ${{ matrix.id }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      LABELS: ${{ matrix.labels }}
      SELF_TEST: ${{ matrix.self_test }}
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: qrosetta-${{ matrix.infra_host }}:${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: scripts/release/image.sh build

      - name: Self-test
        run: scripts/release/image.sh self-test

      - name: Scan
        run: scripts/release/image.sh scan

      - name: Source notice
        run: python3 scripts/release/image_notice.py --image "$IMAGE" --dockerfile "$DOCKERFILE" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('trivy/trivy.sarif') != '' }}
        with:
          name: trivy-${{ matrix.id }}
          path: trivy/trivy.sarif
          if-no-files-found: error

  scan-results:
    name: code scanning ${{ matrix.id }}
    needs: [plan, images]
    if: ${{ !cancelled() && github.repository == 'SeQuSoS-Project/QRosetta' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
      actions: read  # read the run's metadata for the SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: trivy-${{ matrix.id }}
          path: trivy

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: steps.download.outcome == 'success'
        with:
          sarif_file: trivy/trivy.sarif
          category: trivy-${{ matrix.id }}

  publish-images:
    name: publish image ${{ matrix.id }}
    needs: [plan, images, openapi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.QROSETTA_PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the image to GHCR
      id-token: write  # keyless cosign signature and attestations
      attestations: write  # store the provenance and SBOM attestations
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      ID: ${{ matrix.id }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      LABELS: ${{ matrix.labels }}
      SELF_TEST: ${{ matrix.self_test }}
      VERSION: ${{ needs.plan.outputs.version }}
      REPOSITORY: ${{ needs.plan.outputs.registry }}/qrosetta-${{ matrix.infra_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: IMAGE="$REPOSITORY:$VERSION" scripts/release/image.sh build

      - name: Push
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$REPOSITORY:$VERSION"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$VERSION")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Self-test by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker image rm "$REPOSITORY:$VERSION"
          docker pull "$REPOSITORY@$DIGEST"
          IMAGE="$REPOSITORY@$DIGEST" scripts/release/image.sh self-test

      - name: Source notice
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p notices
          python3 scripts/release/image_notice.py --image "$REPOSITORY@$DIGEST" --dockerfile "$DOCKERFILE" \
            --name "$REPOSITORY:$VERSION" --id "$DIGEST" \
            --notices-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/THIRD_PARTY_NOTICES.md" \
            > "notices/NOTICE-$ID.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notice-${{ matrix.id }}
          path: notices/
          if-no-files-found: error

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REPOSITORY@$DIGEST"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Image id
        id: image-id
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          config=$(docker buildx imagetools inspect --raw "$REPOSITORY@$DIGEST" \
            | python3 -c 'import json, sys; m = json.load(sys.stdin); print(m["config"]["digest"])')
          local_id=$(docker image inspect --format '{{.Id}}' "$REPOSITORY@$DIGEST")
          if [ "$config" != "$local_id" ]; then
            echo "::error::config digest $config differs from the pulled image's id $local_id"
            exit 1
          fi
          echo "image_id=$config" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REPOSITORY }}@${{ steps.push.outputs.digest }}
          syft-version: v1.55.0
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: SBOM for the release page
        run: |
          mkdir -p sbom
          cp sbom.spdx.json "sbom/sbom-$ID.spdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.id }}
          path: sbom/
          if-no-files-found: error

      - name: Record the digest and image id
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_ID: ${{ steps.image-id.outputs.image_id }}
        run: |
          mkdir -p digests
          printf '{"%s": {"digest": "%s", "image_id": "%s"}}\n' "$ID" "$DIGEST" "$IMAGE_ID" > "digests/$ID.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.id }}
          path: digests/
          if-no-files-found: error

  wheel:
    name: wheel and sdist
    needs: [plan, images, openapi, publish-images]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.openapi.result == 'success' && (needs.publish-images.result == 'success' || needs.publish-images.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REGISTRY: ${{ needs.plan.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install build==1.3.0 PyYAML==6.0.3 pydantic==2.9.2 pydantic-settings==2.14.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.publish-images.result == 'success'
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Version the dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'EOF'
          import os, pathlib, re
          path = pathlib.Path("qrosetta_cli/__init__.py")
          path.write_text(re.sub(r'^__version__ = "[^"]+"$', f'__version__ = "{os.environ["VERSION"]}"',
                                 path.read_text(), flags=re.M))
          EOF

      - name: Release manifest
        run: |
          if [ -d digests ]; then
            python scripts/release/make_manifest.py --version "$VERSION" --registry "$REGISTRY" --digests-dir digests \
              --signer-repository "$GITHUB_REPOSITORY"
          else
            python scripts/release/make_manifest.py --version "$VERSION" --registry "$REGISTRY"
          fi

      - name: Build kit
        run: python scripts/release/make_buildkit.py

      - name: Build
        run: python -m build --outdir dist .

      - name: Check the distributions
        run: |
          expected="$VERSION"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          python scripts/release/check_dist.py dist --version "$expected" --require-manifest --require-buildkit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Image list
        if: needs.publish-images.result == 'success'
        run: |
          mkdir -p image-list
          python scripts/release/release_assets.py images --manifest qrosetta_cli/release/manifest.json \
            --out "image-list/qrosetta-$VERSION-images.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.publish-images.result == 'success'
        with:
          name: image-list
          path: image-list/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI (dry run or pre-release)
    needs: [plan, wheel]
    if: ${{ !cancelled() && needs.wheel.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.prerelease == 'true')) }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qrosetta
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: [plan, wheel, publish-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.prerelease == 'false' && needs.publish-images.result == 'success' && needs.wheel.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qrosetta
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: The wheel is a final version
        run: |
          python3 -c 'import glob, re, sys; v = glob.glob("dist/*.whl")[0].split("-")[1]; sys.exit("pre-release " + v + " never goes to PyPI" if re.search(r"(a|b|rc)[0-9]+|[.]dev[0-9]+", v) else 0)'

      - name: The wheel names published images
        run: |
          unzip -p dist/*.whl qrosetta_cli/release/manifest.json > manifest.json
          python3 -c 'import json, sys; m = json.load(open("manifest.json")); sys.exit(0 if m["images_published"] else "the release manifest names no published images")'

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-assets:
    name: release assets
    needs: [plan, openapi, publish-images, wheel, publish-testpypi, publish-pypi]
    if: ${{ !cancelled() && github.repository == 'SeQuSoS-Project/QRosetta' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.openapi.result == 'success' && needs.publish-images.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # keyless signature of the release files' provenance attestation
      attestations: write  # store that attestation
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-list
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: notice-*
          path: assets
          merge-multiple: true

      - name: Check and sum the files
        run: |
          cd assets
          n=$(printf '%s' "$IMAGES" | python3 -c 'import json, sys; print(len(json.load(sys.stdin)))')
          for pattern in 'sbom-*.spdx.json' 'NOTICE-*.txt'; do
            found=$(find . -maxdepth 1 -name "$pattern" | wc -l)
            if [ "$found" -ne "$n" ]; then
              echo "::error::$found files $pattern for $n images"
              exit 1
            fi
          done
          for name in "qrosetta-$VERSION-py3-none-any.whl" "qrosetta-$VERSION.tar.gz" \
                      "openapi-$VERSION.json" "qrosetta-$VERSION-images.txt"; do
            [ -f "$name" ] || { echo "::error::$name is missing"; exit 1; }
          done
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "assets/qrosetta-$VERSION.intoto.jsonl"

      - name: Verify every file against the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          while read -r _ name; do
            gh attestation verify "$name" --bundle "qrosetta-$VERSION.intoto.jsonl" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-images.yml" > /dev/null
            echo "verified $name"
          done < SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  publish-release:
    name: GitHub release (final versions)
    needs: [plan, release-assets, publish-pypi]
    if: ${{ !cancelled() && github.repository == 'SeQuSoS-Project/QRosetta' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.prerelease == 'false' && needs.publish-pypi.result == 'success' && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the draft release, attach its files and publish it
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: A final version, and the files are the attested ones
        run: |
          if [ "$(python3 scripts/release/check_dist.py --prerelease "$VERSION")" != false ]; then
            echo "::error::$VERSION is a pre-release; it gets no GitHub release"
            exit 1
          fi
          cd assets
          sha256sum -c SHA256SUMS

      - name: Release notes
        run: python3 scripts/release/release_assets.py notes --version "$VERSION" --repository "$GITHUB_REPOSITORY" --out notes.md

      - name: Draft
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::release $TAG is already published"
            exit 1
          fi
          if [ "$state" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Quantum Rosetta $VERSION" --notes-file notes.md --generate-notes assets/*

      - name: Check the draft's files
        run: |
          mkdir attached
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir attached
          diff <(cd assets && ls) <(cd attached && ls)
          cd attached
          sha256sum -c ../assets/SHA256SUMS
          cmp "qrosetta-$VERSION.intoto.jsonl" "../assets/qrosetta-$VERSION.intoto.jsonl"

      - name: Publish
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
