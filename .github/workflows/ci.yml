name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches the python:3.10-slim API image; 3.12 is an upper bound.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (parity harness)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            rosetta-api/requirements.txt
            rosetta-api/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rosetta-api/requirements.txt
          pip install -r rosetta-api/tests/requirements.txt
          # Every service and router imports qrosetta_commons. Without this the whole
          # suite errors at collection and the job reports nothing useful.
          pip install ./shared

      - name: Run unit tests
        working-directory: rosetta-api
        run: python -m pytest tests/unit -q -n auto

      # The routes the stable qrosetta commands read, against tests/openapi_cli_baseline.json:
      # fails on a change that breaks an older CLI unless API_LEVELS was raised; prints every
      # difference. Refresh: python -m tests.openapi_cli_contract --write (from rosetta-api/).
      - name: OpenAPI contract for older CLIs
        if: matrix.python-version == '3.12'
        working-directory: rosetta-api
        run: python -m tests.openapi_cli_contract --check

  unit-tests-qiskit:
    name: unit tests with Qiskit (compiler-side checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (parity harness)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            rosetta-api/requirements.txt
            rosetta-api/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rosetta-api/requirements.txt
          pip install -r rosetta-api/tests/requirements.txt
          # The compiler images' Qiskit (it needs numpy 2, so it cannot join the API pins).
          pip install qiskit==2.5.2
          pip install ./shared

      - name: Run unit tests
        working-directory: rosetta-api
        run: python -m pytest tests/unit -q -n auto

  cli:
    # The qrosetta CLI is stdlib-only: no server dependencies are installed, so a CLI import of
    # server code fails here. The client half also runs on macOS and Windows.
    name: CLI (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install pytest only
        run: python -m pip install pytest==8.4.2

      - name: CLI unit tests
        if: runner.os == 'Linux'
        working-directory: rosetta-api
        run: >
          python -m pytest --noconftest -p no:cacheprovider -q
          tests/unit/test_qrosetta_cli.py tests/unit/test_qrosetta_ownership.py
          tests/unit/test_qrosetta_contracts.py tests/unit/test_qrosetta_client.py
          tests/unit/test_qrosetta_doctor.py tests/unit/test_qrosetta_runs.py
          tests/unit/test_qrosetta_reads.py tests/unit/test_qrosetta_hostload.py
          tests/unit/test_qrosetta_installed.py

      - name: Client half
        if: runner.os != 'Linux'
        working-directory: rosetta-api
        run: >
          python -m pytest --noconftest -p no:cacheprovider -q
          tests/unit/test_qrosetta_client.py tests/unit/test_qrosetta_reads.py

  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check frontend JS
        run: |
          for f in rosetta-api/static/js/*.js; do
            node --check "$f"
          done

      # node --check only parses. This resolves names and types across the files,
      # which is what catches a typo'd function or a renamed helper.
      - name: Type-check frontend JS
        run: ./scripts/check_frontend_types.sh

      - name: Byte-compile Python (services, routers, schemas, runners, commons)
        run: |
          python -m compileall -q \
            rosetta-api/services rosetta-api/routers rosetta-api/schemas \
            rosetta-api/main.py rosetta-api/config.py \
            runners/*/main.py shared/qrosetta_commons

      - name: Check for unused imports
        run: |
          pip install pyflakes==3.2.0
          python -m pyflakes \
            rosetta-api/services rosetta-api/routers rosetta-api/schemas \
            rosetta-api/main.py rosetta-api/config.py \
            runners/*/main.py shared/qrosetta_commons

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: No credential or private files tracked
        run: git ls-files | scripts/hooks/forbidden_paths.sh

      - name: No secrets anywhere in history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .
