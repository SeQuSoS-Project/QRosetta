# Unit tests, the CLI on every supported Python, static checks, lint, secret scan, an integration
# run of a built stack, actionlint and zizmor. Every action is pinned to a commit (the comment gives
# its release; one commit per action across the workflows); the token is read-only and no checkout
# keeps it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches the python:3.10-slim API image; 3.12 is an upper bound.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (parity harness)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            rosetta-api/requirements.txt
            rosetta-api/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rosetta-api/requirements.txt
          pip install -r rosetta-api/tests/requirements.txt
          # Every service and router imports qrosetta_commons. Without this the whole
          # suite errors at collection and the job reports nothing useful.
          pip install ./shared

      - name: Run unit tests
        working-directory: rosetta-api
        # Coverage on the 3.12 leg only; [tool.coverage] in pyproject.toml says what is measured.
        env:
          PYTEST_ADDOPTS: ${{ matrix.python-version == '3.12' && '--cov --cov-config=../pyproject.toml --cov-report=term:skip-covered --cov-report=xml:coverage.xml' || '' }}
        run: python -m pytest tests/unit -q -n auto

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-py3.12
          path: rosetta-api/coverage.xml
          if-no-files-found: warn

      # The routes the stable qrosetta commands read, against tests/openapi_cli_baseline.json:
      # fails on a change that breaks an older CLI unless API_LEVELS was raised; prints every
      # difference. Refresh: python -m tests.openapi_cli_contract --write (from rosetta-api/).
      - name: OpenAPI contract for older CLIs
        if: matrix.python-version == '3.12'
        working-directory: rosetta-api
        run: python -m tests.openapi_cli_contract --check

  unit-tests-qiskit:
    name: unit tests with Qiskit (compiler-side checks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (parity harness)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            rosetta-api/requirements.txt
            rosetta-api/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rosetta-api/requirements.txt
          pip install -r rosetta-api/tests/requirements.txt
          # The compiler images' Qiskit (it needs numpy 2, so it cannot join the API pins).
          pip install qiskit==2.5.2
          pip install ./shared

      - name: Run unit tests
        working-directory: rosetta-api
        run: python -m pytest tests/unit -q -n auto

  cli:
    # The qrosetta CLI is stdlib-only: no server dependencies are installed, so a CLI import of
    # server code fails here. The client half also runs on macOS and Windows.
    name: CLI (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install pytest only
        run: python -m pip install pytest==8.4.2

      - name: CLI unit tests
        if: runner.os == 'Linux'
        working-directory: rosetta-api
        run: >
          python -m pytest --noconftest -p no:cacheprovider -q
          tests/unit/test_qrosetta_cli.py tests/unit/test_qrosetta_ownership.py
          tests/unit/test_qrosetta_contracts.py tests/unit/test_qrosetta_client.py
          tests/unit/test_qrosetta_doctor.py tests/unit/test_qrosetta_runs.py
          tests/unit/test_qrosetta_reads.py tests/unit/test_qrosetta_hostload.py
          tests/unit/test_qrosetta_views.py tests/unit/test_job_link.py
          tests/unit/test_qrosetta_installed.py tests/unit/test_qrosetta_quota.py
          tests/unit/test_qrosetta_imageprobes.py tests/unit/test_qrosetta_images.py
          tests/unit/test_v1_06_cli_trust_boundaries.py tests/unit/test_v1_07_cli_crate_reader.py
          tests/unit/test_v1_08_cli_transfer_retries.py tests/unit/test_v1_12_engine_timeouts.py
          tests/unit/test_base_image_eol.py

      - name: Client half
        if: runner.os != 'Linux'
        working-directory: rosetta-api
        run: >
          python -m pytest --noconftest -p no:cacheprovider -q
          tests/unit/test_qrosetta_client.py tests/unit/test_qrosetta_reads.py

  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Syntax-check frontend JS
        run: |
          for f in rosetta-api/static/js/*.js; do
            node --check "$f"
          done

      # node --check only parses. This resolves names and types across the files,
      # which is what catches a typo'd function or a renamed helper.
      - name: Type-check frontend JS
        run: ./scripts/check_frontend_types.sh

      - name: Byte-compile Python (services, routers, schemas, runners, commons)
        run: |
          python -m compileall -q \
            rosetta-api/services rosetta-api/routers rosetta-api/schemas \
            rosetta-api/main.py rosetta-api/config.py \
            runners/*/main.py shared/qrosetta_commons

      - name: LICENSE and Licence.txt are identical
        run: cmp LICENSE Licence.txt

      - name: Check for unused imports
        run: |
          pip install pyflakes==3.2.0
          python -m pyflakes \
            rosetta-api/services rosetta-api/routers rosetta-api/schemas \
            rosetta-api/main.py rosetta-api/config.py \
            runners/*/main.py shared/qrosetta_commons

  lint:
    # ruff (rules and per-file baseline in pyproject.toml), shellcheck over scripts/ and hadolint over
    # every Dockerfile, then Semgrep, each failing only on findings above scripts/lint/*.txt.
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff and shellcheck
        run: python -m pip install -r scripts/lint/requirements.txt

      - name: Install hadolint
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format (qrosetta_cli only)
        run: ruff format --check --diff qrosetta_cli

      - name: shellcheck and hadolint against their baselines
        env:
          HADOLINT: ${{ runner.temp }}/hadolint
        run: scripts/lint/check.sh

      # In its own virtual environment, apart from ruff and shellcheck: 66 packages pinned with their wheel hashes.
      - name: Install Semgrep
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: \
            -r scripts/lint/semgrep-requirements.txt

      # The rule packs come from the Semgrep registry and are not versioned: a new rule that reports a
      # finding fails this step until the finding is fixed or added to scripts/lint/semgrep.txt.
      - name: Semgrep against its baseline
        env:
          SEMGREP: ${{ runner.temp }}/semgrep/bin/semgrep
        run: scripts/lint/check.sh semgrep

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: No credential or private files tracked
        run: git ls-files | scripts/hooks/forbidden_paths.sh

      - name: No secrets anywhere in history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .

  integration:
    # Builds nginx, the API and three runners from this commit with the repository's compose file
    # (resource limits as on a user's machine: the hosted runner's rootful Docker applies the CPU
    # quota), starts them, and runs the end-to-end tests through nginx, the qrosetta client commands
    # and the runner contract probes against them. No secrets: the stack runs in local mode with an
    # ephemeral signing key, and the tests create and delete their own account.
    name: integration (nginx, API, qiskit, qulacs, cirq)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SERVICES: nginx api pytket_qiskit_runner pytket_qulacs_runner pytket_cirq_runner
      RUNNER_HOSTS: pytket-qiskit-runner pytket-qulacs-runner pytket-cirq-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the images
        run: |
          docker compose version
          # shellcheck disable=SC2086
          QROSETTA_GIT_SHA="${GITHUB_SHA::7}" docker compose build $SERVICES

      - name: Start the stack
        run: |
          # shellcheck disable=SC2086
          QROSETTA_GIT_SHA="${GITHUB_SHA::7}" docker compose up -d --no-build --wait --wait-timeout 300 $SERVICES

      - name: Wait for the runners
        run: |
          for host in $RUNNER_HOSTS; do
            for attempt in $(seq 60); do
              if docker compose exec -T api python3 -c \
                "import urllib.request; urllib.request.urlopen('http://$host:8000/capabilities', timeout=5)"; then
                echo "$host answers (attempt $attempt)"
                continue 2
              fi
              sleep 3
            done
            echo "$host did not answer within 3 minutes"
            exit 1
          done
          curl -fsS http://127.0.0.1:8080/config > /dev/null

      - name: Install the test dependencies
        run: |
          python -m pip install -r tests/integration/requirements.txt
          python -m pip install ./shared

      - name: End-to-end, CLI and runner contract tests
        env:
          QROSETTA_BASE_URL: http://127.0.0.1:8080
          QROSETTA_TEST_RUNNERS: qiskit,qulacs,cirq
          QROSETTA_E2E_REQUIRE_CURRENT: "1"
        run: >
          python -m pytest -v -p no:cacheprovider
          tests/integration/test_e2e_nginx.py tests/integration/test_e2e_cli.py
          tests/integration/test_runner_contract_asymmetric.py

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  actionlint:
    # Lints every workflow under .github/workflows, with the run scripts checked by ShellCheck, then
    # audits the workflows and dependabot.yml with zizmor. actionlint and ShellCheck are pinned
    # release binaries checked against their published sha256; zizmor is a hash-pinned wheel.
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          actionlint="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          shellcheck="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$actionlint" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint}"
          curl -fsSL -o "$RUNNER_TEMP/$shellcheck" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${shellcheck}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$actionlint" | sha256sum -c -
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$shellcheck" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$actionlint" -C "$RUNNER_TEMP" actionlint
          tar -xzf "$RUNNER_TEMP/$shellcheck" -C "$RUNNER_TEMP" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck "$RUNNER_TEMP/shellcheck"'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: >
          python -m pip install --require-hashes --no-deps --only-binary=:all:
          -r scripts/lint/zizmor-requirements.txt

      # Online audits (impostor commits, release comments that do not match the pinned commit, known
      # vulnerable actions) read public repositories through the job's read-only token.
      - name: Audit the workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .
