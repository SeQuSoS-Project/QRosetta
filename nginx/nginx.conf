events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # GET /algorithms is the frontend keepalive poll; keep it out of the access log.
    map $request $loggable {
        "~^GET /algorithms " 0;
        default              1;
    }
    access_log /var/log/nginx/access.log combined if=$loggable;

    server_tokens off;

    server {
        listen 80;

        # Above the API's MAX_UPLOAD_BYTES so the API returns its own 413.
        client_max_body_size 5M;

        # Docker DNS with a short TTL so 'rosetta-api' is re-resolved after restarts.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream http://rosetta-api:8000;

        root /usr/share/nginx/html;

        location = / {
            try_files /index.html =404;
        }

        # The read-only share page: scripts and styles from this origin only, never framed.
        location = /share.html {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            try_files /share.html =404;
        }

        # Existing files are served from disk; everything else goes to the API.
        location / {
            try_files $uri @proxy;
        }

        location @proxy {
            proxy_pass $api_upstream;
            # Clearing Accept-Encoding makes the API skip gzip, which this proxy mangled.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 300s maximum job time plus a 30s buffer.
            proxy_read_timeout 330s;
            proxy_connect_timeout 330s;
            proxy_send_timeout 330s;
        }
    }
}
